<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语长文本高频词看板</title>
    <script src="https://unpkg.com"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4">
    <div id="app" class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
        <h1 class="text-xl font-black mb-1 text-slate-800 flex items-center gap-2">📊 日语长文本高频词榜</h1>
        <p class="text-xs text-slate-400 mb-6">优先攻克前 200 个核心词汇</p>
        
        <!-- 过滤器分类 -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button @click="filterPOS = ''" :class="!filterPOS ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl text-xs font-bold transition">全部</button>
            <button @click="filterPOS = '名詞'" :class="filterPOS === '名詞' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl text-xs font-bold transition">名词</button>
            <button @click="filterPOS = '動詞'" :class="filterPOS === '動詞' ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl text-xs font-bold transition">动词</button>
            <button @click="filterPOS = '形容詞'" :class="filterPOS === '形容詞' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'" class="px-3 py-1.5 rounded-xl text-xs font-bold transition">形容词</button>
        </div>

        <!-- 单词列表 -->
        <div class="divide-y divide-slate-100 max-h-[70vh] overflow-y-auto pr-1">
            <div v-for="(item, index) in filteredWords.slice(0, 200)" :key="index" class="py-3.5 flex justify-between items-center group">
                <div class="flex items-center gap-3">
                    <span class="text-xs font-bold text-slate-300 w-6">#{{ index + 1 }}</span>
                    <div>
                        <!-- 点击单词直接跳转 MOJi 辞书网页端查询 -->
                        <a :href="'https://mojidict.com' + item.Word" target="_blank" class="text-lg font-bold text-slate-800 hover:text-indigo-600 underline decoration-wavy decoration-transparent hover:decoration-indigo-400 transition">
                            {{ item.Word }}
                        </a>
                        <span class="ml-2 text-[10px] px-2 py-0.5 rounded-md font-medium bg-slate-100 text-slate-500">{{ item.POS }}</span>
                    </div>
                </div>
                <span class="text-xs font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-lg">出现 {{ item.Count }} 次</span>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const words = ref([]);
                const filterPOS = ref('');

                onMounted(async () => {
                    const res = await fetch('word_data.json');
                    words.value = await res.json();
                });

                const filteredWords = computed(() => {
                    if (!filterPOS.value) return words.value;
                    return words.value.filter(w => w.POS.includes(filterPOS.value));
                });

                return { words, filterPOS, filteredWords };
            }
        }).mount('#app')
    </script>
</body>
</html>
