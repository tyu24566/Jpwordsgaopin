<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语长文本高频词看板</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 15px; margin: 0; color: #334155; }
        .card { max-width: 450px; margin: 0 auto; background: white; padding: 20px; rounded-radius: 12px; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; font-weight: 900; margin: 0 0 5px 0; color: #1e293b; }
        .sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        button { background: #f1f5f9; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; color: #475569; cursor: pointer; }
        button.active { background: #4f46e5; color: white; }
        .list { max-height: 70vh; overflow-y: auto; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .word-link { font-size: 18px; font-weight: bold; color: #1e293b; text-decoration: none; }
        .word-link:hover { color: #4f46e5; text-decoration: underline; }
        .tag { font-size: 10px; background: #f1f5f9; color: #64748b; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: normal; }
        .count { font-size: 12px; font-weight: 900; color: #4f46e5; background: #e0e7ff; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 日语长文本高频词榜</h1>
        <div class="sub">优先攻克前 200 个核心词汇（点击单词跳转MOJi词典）</div>
        <div class="btn-group">
            <button id="btn-all" class="active" onclick="filterPOS('')">全部</button>
            <button id="btn-noun" onclick="filterPOS('名詞')">名词</button>
            <button id="btn-verb" onclick="filterPOS('動詞')">动词</button>
            <button id="btn-adj" onclick="filterPOS('形容詞')">形容词</button>
        </div>
        <div class="list" id="word-list">加载中...</div>
    </div>
    <script>
        let allWords = [];
        async function loadData() {
            try {
                const res = await fetch('word_data.json');
                allWords = await res.json();
                render('');
            } catch(e) {
                document.getElementById('word-list').innerText = '数据加载失败，请刷新页面重试';
            }
        }
        function render(posFilter) {
            const listEl = document.getElementById('word-list');
            listEl.innerHTML = '';
            let count = 0;
            for(let item of allWords) {
                if (count >= 200) break;
                if (posFilter && !item.POS.includes(posFilter)) continue;
                count++;
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:12px; color:#cbd5e1; font-weight:bold; width:25px;">#${count}</span>
                        <div>
                            <a class="word-link" href="https://mojidict.com{item.Word}" target="_blank">${item.Word}</a>
                            <span class="tag">${item.POS}</span>
                        </div>
                    </div>
                    <span class="count">出现 ${item.Count} 次</span>
                `;
                listEl.appendChild(div);
            }
        }
        function filterPOS(pos) {
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            if(!pos) document.getElementById('btn-all').classList.add('active');
            else if(pos==='名詞') document.getElementById('btn-noun').classList.add('active');
            else if(pos==='動詞') document.getElementById('btn-verb').classList.add('active');
            else if(pos==='形容詞') document.getElementById('btn-adj').classList.add('active');
            render(pos);
        }
        loadData();
    </script>
</body>
</html>
